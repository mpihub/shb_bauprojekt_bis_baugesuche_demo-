
name: SHB Baugesetz Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shb-baugesetz-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offizielle Quellen pruefen
        run: python scripts/check_sources.py

      - name: Pruefergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/changes.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatischer Quellencheck"
            git push
          fi

      - name: Webseite vorbereiten
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/sources.json site/data/sources.json
          cp data/changes.json site/data/changes.json
          touch site/.nojekyll

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webseite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'

  deploy:
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veroeffentlichen
        uses: actions/deploy-pages@v4
        id: deployment
